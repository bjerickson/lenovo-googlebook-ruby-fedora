# Installed into /etc/ruby-boot/dracut.conf.d/. Conf.d files load after --conf, and
# Fedora's /usr/lib/dracut/dracut.conf.d/01-dist.conf would otherwise override
# dracut.conf (all keymaps/fonts, rescue tools). Unlocking LUKS with a typed password
# needs none of FIPS, TPM2, FIDO2, PKCS#11 or PCR measurement.
i18n_install_all="no"
install_optional_items=""
# No fsck tools: Btrfs needs none at boot, and fsck.erofs alone drags in libqpl + libstdc++.
nofscks="yes"
compress="zstd -19 -T0"
# Exclusive module list. Fedora builds the keyboard (i8042/atkbd), USB HID/xHCI, simpledrm,
# fbcon, Btrfs and AES-NI/XTS into the kernel; only these are modules. dracut adds their
# dependencies. coreboot-fb.conf appends the framebuffer pair when DKMS built them.
drivers="nvme vmd dm_crypt"
omit_dracutmodules+=" fips fips-crypto-policies tpm2-tss systemd-pcrextend systemd-pcrphase systemd-battery-check systemd-coredump systemd-repart systemd-sysext systemd-veritysetup systemd-integritysetup fido2 pkcs11 pcsc crypt-gpg crypt-loop rngd rescue nvdimm plymouth network network-manager nfs iscsi nbd fcoe multipath lvm mdraid dmraid qemu qemu-net biosdevname memstrack resume squash brltty bluetooth dbus dbus-broker dbus-daemon "
