# Ruby encrypted-root initramfs for vendor_boot_a (32 MiB partition, 29 MiB budget).
# Used only with --conf /etc/ruby-boot/dracut.conf --confdir /etc/ruby-boot/dracut.conf.d,
# so ordinary /etc/dracut.conf.d changes (and kernel-install's own initramfs) never affect it.
#
# Boot flow: systemd initrd asks for the LUKS password (rd.luks.name= on the command
# line), mounts subvol=@ and switches root. Xe is never loaded here: ruby-gpu.service
# loads it once from the real root, so no GPU driver or firmware belongs in this image.
hostonly="yes"
hostonly_cmdline="no"
compress="zstd -19 -T0"
early_microcode="yes"
add_dracutmodules+=" systemd crypt dm btrfs i18n "
omit_dracutmodules+=" plymouth network network-manager nfs iscsi nbd fcoe fcoe-uefi multipath lvm mdraid dmraid nvdimm qemu qemu-net biosdevname memstrack resume squash brltty dbus-broker dbus-daemon bluetooth "
add_drivers+=" nvme dm_crypt aesni_intel xts "
omit_drivers+=" xe i915 snd_sof_pci_intel_ptl "
