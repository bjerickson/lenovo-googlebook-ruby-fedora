PACKAGE_NAME="ruby-coreboot"
PACKAGE_VERSION="7.3.3"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]="coreboot_table"
BUILT_MODULE_NAME[1]="framebuffer-coreboot"
BUILT_MODULE_NAME[2]="vpd-sysfs"
DEST_MODULE_LOCATION[0]="/extra"
DEST_MODULE_LOCATION[1]="/extra"
DEST_MODULE_LOCATION[2]="/extra"
AUTOINSTALL="yes"
